              properties:
                bindings:
                  description:
                    Bindings has one entry per (HostEndpoint, interface)
                    the policy resolves to on this host.
                  items:
                    description: |-
                      HostQoSPolicyBindingStatus is the state of one (HostEndpoint, interface) binding.
