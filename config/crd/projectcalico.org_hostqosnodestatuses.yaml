spec:
  group: projectcalico.org
  names:
    kind: HostQoSNodeStatus
    listKind: HostQoSNodeStatusList
    plural: hostqosnodestatuses
    shortNames:
      - hqns
    singular: hostqosnodestatus
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.policy
          name: Policy
          type: string
        - jsonPath: .spec.node
          name: Node
          type: string
        - jsonPath: .spec.hostType
          name: HostType
          type: string
        - jsonPath: .status.state
          name: State
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v3
      schema:
        openAPIV3Schema:
          description:
            HostQoSNodeStatus is one host's view of one HostQoSPolicy, written
            by that host's Felix.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description:
                HostQoSNodeStatusSpec identifies the policy and host this
                status describes.
              properties:
                hostType:
                  description:
                    HostType keeps a cluster node apart from a non-cluster
                    host of the same name.
                  enum:
                    - ClusterNode
                    - NonClusterHost
                  type: string
                node:
                  description:
                    Node is the cluster node name, or the hostname of a non-cluster
